<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>90s Ki Yaadein 🎵</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#120b16,#241326,#0c1720);
  color:white;
}

header{
  text-align:center;
  padding:30px 15px 20px;
}

h1{
  font-size:34px;
  margin:0 0 8px;
}

.subtitle{
  color:#d8c8d8;
}

.by-ankit{
  margin-top:10px;
  font-size:16px;
  font-weight:bold;
}

.container{
  max-width:900px;
  margin:auto;
  padding:15px;
}

.tabs{
  display:flex;
  gap:10px;
  margin-bottom:15px;
}

.tab{
  flex:1;
  padding:14px;
  border:0;
  border-radius:12px;
  background:#2a2230;
  color:white;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

.tab.active{
  background:#e8b86b;
  color:#171017;
}

.search-box{
  width:100%;
  padding:14px 16px;
  margin-bottom:20px;
  border:0;
  border-radius:12px;
  font-size:16px;
  outline:none;
}

.player{
  background:#17131b;
  border-radius:18px;
  padding:15px;
  box-shadow:0 8px 30px #0008;
  margin-bottom:20px;
}

iframe{
  width:100%;
  aspect-ratio:16/9;
  border:0;
  border-radius:12px;
}

.now{
  font-size:19px;
  font-weight:bold;
  margin:15px 0;
}

.controls{
  display:flex;
  justify-content:center;
  gap:10px;
}

.controls button{
  border:0;
  border-radius:10px;
  padding:12px 18px;
  font-size:15px;
  cursor:pointer;
  background:#e8b86b;
  color:#171017;
  font-weight:bold;
}

.playlist{
  display:grid;
  gap:10px;
}

.song{
  background:#1b1720;
  border:1px solid #ffffff18;
  border-radius:12px;
  padding:15px;
  cursor:pointer;
}

.song:hover{
  background:#2b2230;
}

.song.active{
  border-color:#e8b86b;
  background:#302538;
}

.song-number{
  color:#e8b86b;
  margin-right:8px;
}

.song-title{
  font-weight:bold;
}

.no-result{
  text-align:center;
  color:#aaa;
  padding:20px;
}

footer{
  text-align:center;
  padding:30px;
  color:#aaa;
}
</style>
</head>

<body>

<header>
<h1>🎵 90s Ki Yaadein</h1>
<div class="subtitle">Purane aur naye gaanon ki yaadein ❤️</div>
<div class="by-ankit">By Ankit ❤️</div>
</header>

<div class="container">

<div class="tabs">
<button id="tab90s" class="tab active" onclick="changeCategory('90s')">
🎵 90s
</button>

<button id="tabNew" class="tab" onclick="changeCategory('new')">
🆕 New
</button>
</div>

<input
type="text"
id="searchBox"
class="search-box"
placeholder="🔍 Search Song..."
oninput="searchSongs()"
>

<div class="player">

<iframe
id="youtubePlayer"
src="https://www.youtube.com/embed/i8kO5dAx5dE"
title="YouTube player"
allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
allowfullscreen>
</iframe>

<div class="now" id="nowPlaying">
Bahut Jatate Ho Chah Humse
</div>

<div class="controls">
<button onclick="previousSong()">⏮ Previous</button>
<button onclick="nextSong()">Next ⏭</button>
</div>

</div>

<div class="playlist" id="playlist"></div>

</div>

<footer>
© 2026 • 90s Ki Yaadein • By Ankit ❤️
</footer>

<script>

const newSongs = [

name:"Tough"
},
{

name:"Katha Lagta"
},
{

name:"Low Fade"
},
{
id:"_cyQq-utMns",
name:"Wavy"
},
{
id:"GE6w7DRyqcM",
name:"Headliner"
},
{

name:"Bhoom Shaka"
},
{
id:"eHyl9KG9RWA",
name:"3.59"
},
{

name:"Boyfriend"
},

},

}
];

let category="90s";
let currentSong=0;

const playlist=document.getElementById("playlist");
const player=document.getElementById("youtubePlayer");
const nowPlaying=document.getElementById("nowPlaying");

function getSongs(){
return category==="90s" ? songs90s : newSongs;
}

function loadPlaylist(list=getSongs()){

playlist.innerHTML="";

if(list.length===0){
playlist.innerHTML='<div class="no-result">Song nahi mila 😔</div>';
return;
}

list.forEach((song)=>{

const index=getSongs().indexOf(song);

const div=document.createElement("div");

div.className="song"+(index===currentSong ? " active":"");

div.innerHTML=`
<span class="song-number">${index+1}.</span>
<span class="song-title">${song.name}</span>
`;

div.onclick=()=>playSong(index);

playlist.appendChild(div);

});
}

function playSong(index){

const songs=getSongs();

currentSong=index;

player.src=
"https://www.youtube.com/embed/"+
songs[index].id+
"?autoplay=1";

nowPlaying.textContent=songs[index].name;

loadPlaylist();

}

function nextSong(){

const songs=getSongs();

currentSong++;

if(currentSong>=songs.length){
currentSong=0;
}

playSong(currentSong);

}

function previousSong(){

const songs=getSongs();

currentSong--;

if(currentSong<0){
currentSong=songs.length-1;
}

playSong(currentSong);

}

function changeCategory(newCategory){

category=newCategory;
currentSong=0;

document.getElementById("searchBox").value="";

document.getElementById("tab90s")
.classList.toggle("active",category==="90s");

document.getElementById("tabNew")
.classList.toggle("active",category==="new");

const songs=getSongs();

player.src=
"https://www.youtube.com/embed/"+
songs[0].id;

nowPlaying.textContent=songs[0].name;

loadPlaylist();

}

function searchSongs(){

const search=document
.getElementById("searchBox")
.value
.toLowerCase()
.trim();

const songs=getSongs();

if(search===""){
loadPlaylist();
return;
}

const filtered=songs.filter(song =>
song.name.toLowerCase().includes(search)
);

loadPlaylist(filtered);

}

loadPlaylist();

</script>

</body>
</html>
