<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>90s Ki Yaadein 🎵</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#120b16,#241326,#0c1720);
  color:white;
}

header{
  text-align:center;
  padding:30px 15px 20px;
}

h1{
  font-size:34px;
  margin:0 0 8px;
}

.subtitle{
  color:#d8c8d8;
}

.by-ankit{
  margin-top:10px;
  font-size:16px;
  font-weight:bold;
  letter-spacing:1px;
}

.container{
  max-width:900px;
  margin:auto;
  padding:15px;
}

.search-box{
  width:100%;
  padding:14px 16px;
  margin-bottom:20px;
  border:0;
  border-radius:12px;
  font-size:16px;
  outline:none;
}

.player{
  background:#17131b;
  border-radius:18px;
  padding:15px;
  box-shadow:0 8px 30px #0008;
  margin-bottom:20px;
}

iframe{
  width:100%;
  aspect-ratio:16/9;
  border:0;
  border-radius:12px;
}

.now{
  font-size:20px;
  font-weight:bold;
  margin:15px 0;
}

.controls{
  display:flex;
  justify-content:center;
  gap:10px;
}

button{
  border:0;
  border-radius:10px;
  padding:12px 18px;
  font-size:16px;
  cursor:pointer;
  background:#e8b86b;
  color:#171017;
  font-weight:bold;
}

.playlist{
  display:grid;
  gap:10px;
}

.song{
  background:#1b1720;
  border:1px solid #ffffff18;
  border-radius:12px;
  padding:15px;
  cursor:pointer;
}

.song:hover{
  background:#2b2230;
}

.song.active{
  border-color:#e8b86b;
  background:#302538;
}

.song-title{
  font-weight:bold;
}

.song-number{
  color:#e8b86b;
  margin-right:8px;
}

.no-result{
  text-align:center;
  color:#aaa;
  padding:20px;
}

footer{
  text-align:center;
  padding:30px;
  color:#aaa;
}
</style>
</head>

<body>

<header>
  <h1>🎵 90s Ki Yaadein</h1>
  <div class="subtitle">Purane gaanon ki khoobsurat yaadein ❤️</div>
  <div class="by-ankit">By Ankit ❤️</div>
</header>

<div class="container">

<input
  type="text"
  id="searchBox"
  class="search-box"
  placeholder="🔍 Search Song..."
  oninput="searchSongs()"
>

<div class="player">

<iframe
  id="youtubePlayer"
  src="https://www.youtube.com/embed/i8kO5dAx5dE"
  title="YouTube player"
  allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
  allowfullscreen>
</iframe>

<div class="now" id="nowPlaying">
Bahut Jatate Ho Chah Humse
</div>

<div class="controls">
<button onclick="previousSong()">⏮ Previous</button>
<button onclick="nextSong()">Next ⏭</button>
</div>

</div>

<div class="playlist" id="playlist"></div>

</div>

<footer>
© 2026 • 90s Ki Yaadein • By Ankit ❤️
</footer>

<script>

const songs = [
"i8kO5dAx5dE",
"D61BvxAOxm0",
"O6JTWVkJYtM",
"6qBdQzPnw4E",
"BukHiHrbFpA",
"clp9VpVA8Tg",
"JOt45suga2s",
"U2ETIaxA3eI",
"Z9VpwQD27jI",
"swC9xzv1kXE",
"8sH7rSHpjB4",
"cBw4H6Dx4vc",
"asVkFSVdJPo",
"XQMaYG4A0_Y",
"TJfTuTQMoDM"
];

const songNames = [
"Bahut Jatate Ho Chah Humse",
"Kaun Disha Mein Leke Chala Re",
"Chand Ke Paar Chalo",
"Dil Laga Liya Maine Tumse Pyaar Karke",
"Rab Kare Tujhko Bhi",
"Kitna Pyaara Hai Yeh Chehra",
"Kisi Se Tum Pyaar Karo",
"Yeh Dua Hai Meri Rab Se",
"Tujhe Na Dekhun Toh Chain",
"Main Agar Saamne Aa Bhi Jaya Karun",
"Choodi Maza Na Degi",
"Ghoonghat Ki Aad Se",
"Mujhse Mohabbat Ka Izhaar",
"Song 14",
"Aap Ke Aa Jaane Se"
];

let currentSong = 0;

const playlist = document.getElementById("playlist");
const player = document.getElementById("youtubePlayer");
const nowPlaying = document.getElementById("nowPlaying");

function loadPlaylist(list = songs){

  playlist.innerHTML = "";

  if(list.length === 0){
    playlist.innerHTML =
      '<div class="no-result">Song nahi mila 😔</div>';
    return;
  }

  list.forEach((id)=>{

    const index = songs.indexOf(id);

    const div = document.createElement("div");

    div.className =
      "song" + (index === currentSong ? " active" : "");

    div.innerHTML = `
      <span class="song-number">${index + 1}.</span>
      <span class="song-title">${songNames[index]}</span>
    `;

    div.onclick = () => playSong(index);

    playlist.appendChild(div);

  });
}

function playSong(index){

  currentSong = index;

  player.src =
    "https://www.youtube.com/embed/" +
    songs[index] +
    "?autoplay=1";

  nowPlaying.textContent = songNames[index];

  loadPlaylist();
}

function nextSong(){

  currentSong++;

  if(currentSong >= songs.length){
    currentSong = 0;
  }

  playSong(currentSong);
}

function previousSong(){

  currentSong--;

  if(currentSong < 0){
    currentSong = songs.length - 1;
  }

  playSong(currentSong);
}

function searchSongs(){

  const search =
    document.getElementById("searchBox").value.toLowerCase().trim();

  if(search === ""){
    loadPlaylist();
    return;
  }

  const filtered = songs.filter((id,index) =>
    songNames[index].toLowerCase().includes(search)
  );

  loadPlaylist(filtered);
}

loadPlaylist();

</script>

</body>
</html>
